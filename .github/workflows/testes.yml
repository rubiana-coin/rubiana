name: Testes unitarios

on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites a rodar, separadas por espaco (vazio = todas)"
        required: false
        default: ""

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf python3 libevent-dev libboost-dev libsqlite3-dev
      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=OFF
      - name: Compilar os testes
        run: |
          set -o pipefail
          cmake --build build -j $(nproc) --target test_bitcoin 2>&1 | tee compilar.log
      - name: Rodar uma suite por vez
        continue-on-error: true
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          if [ -n "$SUITES" ]; then printf '%s\n' $SUITES > suites.txt; else ./build/bin/test_bitcoin --list_content 2>&1 | grep -E '^[A-Za-z0-9_]+\*$' | tr -d '*' > suites.txt; fi
          wc -l suites.txt
          for s in $(cat suites.txt); do
            if timeout 1800 ./build/bin/test_bitcoin -t "$s" --log_level=error > "log-$s.txt" 2>&1; then
              echo "PASSOU $s"
            else
              echo "FALHOU $s (codigo $?)"
            fi
          done | tee resumo.txt
          echo "PASSOU: $(grep -c '^PASSOU' resumo.txt)  FALHOU: $(grep -c '^FALHOU' resumo.txt)" | tee -a resumo.txt
      - name: Guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-testes
          path: |
            compilar.log
            suites.txt
            resumo.txt
            log-*.txt
