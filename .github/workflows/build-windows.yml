name: Compilar Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta da Release (vazio = so gerar o artefato)"
        required: false
        default: ""

      rede:
        description: "Rede do pacote"
        type: choice
        options:
          - testnet
          - principal
        default: testnet

      rede:
        description: "Rede do pacote"
        type: choice
        options:
          - testnet
          - principal
        default: testnet

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-24.04
    env:
      REDE: ${{ inputs.rede }}
      TAG: ${{ inputs.tag }}
    env:
      REDE: ${{ inputs.rede }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake pkgconf bsdmainutils curl git ca-certificates python3 cmake g++-mingw-w64-x86-64-posix wine64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
      - name: Recuperar bibliotecas de apoio (cache)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-w64-mingw32
          key: windows-depends-${{ hashFiles('depends/packages/**', 'depends/*.mk') }}
      - name: Bibliotecas de apoio (demora)
        run: make -C depends HOST=x86_64-w64-mingw32 NO_QT=1 NO_ZMQ=1 NO_IPC=1 -j $(nproc)
      - name: Guardar bibliotecas de apoio (cache)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/x86_64-w64-mingw32
          key: windows-depends-${{ hashFiles('depends/packages/**', 'depends/*.mk') }}
      - name: Marcar como versao final (rede principal)
        if: ${{ inputs.rede == 'principal' }}
        run: |
          grep -q 'set(CLIENT_VERSION_IS_RELEASE "false")' CMakeLists.txt
          sed -i 's/set(CLIENT_VERSION_IS_RELEASE "false")/set(CLIENT_VERSION_IS_RELEASE "true")/' CMakeLists.txt
          grep -n "CLIENT_VERSION_IS_RELEASE" CMakeLists.txt
      - name: Marcar como versao final (rede principal)
        if: ${{ inputs.rede == 'principal' }}
        run: |
          grep -q 'set(CLIENT_VERSION_IS_RELEASE "false")' CMakeLists.txt
          sed -i 's/set(CLIENT_VERSION_IS_RELEASE "false")/set(CLIENT_VERSION_IS_RELEASE "true")/' CMakeLists.txt
          grep -n "CLIENT_VERSION_IS_RELEASE" CMakeLists.txt
      - name: Configurar
        run: cmake -B build --toolchain depends/x86_64-w64-mingw32/toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_IPC=OFF
      - name: Compilar
        run: cmake --build build -j $(nproc) --target bitcoin bitcoind bitcoin-cli bitcoin-tx bitcoin-util bitcoin-wallet
      - name: Compilar o motor de mineracao
        run: x86_64-w64-mingw32-g++-posix -O2 -std=c++17 -static -o build/bin/rubiana-miner.exe tools/rubiana-miner.cpp -I src/randomx/src $(find build -name librandomx.a | head -1) -lpthread
      - name: Listar
        run: ls -l build/bin
      - name: Conferir que abre (Wine)
        continue-on-error: true
        run: wine64 build/bin/rubianad.exe -version | head -3
      - name: Guardar os programas
        uses: actions/upload-artifact@v4
        with:
          name: rubiana-windows
          path: |
            build/bin/*.exe
            tools/rubiana-mine.py
            tools/rubiana-solo-miner.py
      - name: Montar o pacote para Windows (clique duplo)
        run: |
          set -e
          mkdir -p pacote/rubiana/build/bin pacote/rubiana/tools pacote/rubiana/python
          cp build/bin/rubianad.exe build/bin/rubiana-cli.exe build/bin/rubiana-miner.exe pacote/rubiana/build/bin/
          cp tools/rubiana-mine.py tools/rubiana-solo-miner.py tools/rubiana-app.py tools/rubiana-explorer.py tools/rubiana_common.py tools/rubiana_carteira.py tools/rubiana_frase.py tools/bip39-english.txt pacote/rubiana/tools/
          cp packaging/windows/* pacote/rubiana/
          if [ "$REDE" = "principal" ]; then
            if [ -n "$TAG" ] && grep -q '^NOS_PRINCIPAL = \[\]' tools/rubiana-mine.py; then
              echo "ERRO: NOS_PRINCIPAL vazio em tools/rubiana-mine.py. Preencha antes de publicar."; exit 1
            fi
            sed -i 's/--rede testnet/--rede principal/; s/REDE DE TESTE/REDE PRINCIPAL/; s/As moedas desta rede de teste NAO tem valor\./Rede real: anote a frase de recuperacao no papel./' pacote/rubiana/*.bat
            sed -i 's/rede de teste/rede principal/; s/:18686/:8686/' pacote/rubiana/nos.txt
            cp packaging/windows-principal/LEIA-ME.txt pacote/rubiana/LEIA-ME.txt
          fi
          sed -i 's/$/\r/' pacote/rubiana/*.bat pacote/rubiana/configuracao.txt pacote/rubiana/LEIA-ME.txt
          cp COPYING pacote/rubiana/COPYING.txt
          cp src/randomx/LICENSE pacote/rubiana/LICENSE-RandomX.txt
          cp src/randomx/LICENSE pacote/rubiana/LICENSE-RandomX.txt
          curl -fsSL -o python-embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          echo "$(cat packaging/python-embed.sha256)  python-embed.zip" | sha256sum -c -
          unzip -q python-embed.zip -d pacote/rubiana/python
          (cd pacote && zip -qr ../rubiana-windows-pacote.zip rubiana)
      - name: Guardar o pacote
        uses: actions/upload-artifact@v4
        with:
          name: rubiana-windows-pacote
          path: rubiana-windows-pacote.zip
      - name: Publicar na Release (opcional)
        if: ${{ inputs.tag != '' && inputs.rede != 'principal' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -e
          cp rubiana-windows-pacote.zip "rubiana-windows-${TAG}.zip"
          sha256sum "rubiana-windows-${TAG}.zip" > SHA256SUMS.txt
          gh release create "$TAG" "rubiana-windows-${TAG}.zip" SHA256SUMS.txt --prerelease --target "$GITHUB_SHA" --title "Rubiana ${TAG} (rede de teste)" --notes "Pacote de Windows da rede de teste. As moedas nao tem valor. Confira o SHA-256 em SHA256SUMS.txt. Veja o LEIA-ME dentro do pacote."
      - name: Publicar na Release da rede principal (opcional)
        if: ${{ inputs.tag != '' && inputs.rede == 'principal' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp rubiana-windows-pacote.zip "rubiana-windows-${TAG}.zip"
          sha256sum "rubiana-windows-${TAG}.zip" > SHA256SUMS.txt
          gh release create "$TAG" "rubiana-windows-${TAG}.zip" SHA256SUMS.txt --target "$GITHUB_SHA" --title "Rubiana ${TAG} (rede principal)" --notes "Pacote de Windows da rede principal da Rubiana. Rede real, comeca em 12/12/2026 as 15:00 UTC (12:00 em Brasilia). Software experimental, sem auditoria externa. Confira o SHA-256 em SHA256SUMS.txt e leia o LEIA-ME dentro do pacote. Guarde a frase de recuperacao: sem ela nao ha como recuperar a carteira."
