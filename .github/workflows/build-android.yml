name: Compilar Android (APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar o motor de mineracao para Android (arm64)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          cmake -S src/randomx -B build-android-rx -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android-rx --target randomx -j $(nproc)
          LIB=$(find build-android-rx -name librandomx.a | head -1)
          echo "biblioteca: $LIB"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" -O2 -std=c++17 -o android/app/src/main/jniLibs/arm64-v8a/libminer.so tools/rubiana-miner.cpp -I src/randomx/src "$LIB" -static-libstdc++
          file android/app/src/main/jniLibs/arm64-v8a/libminer.so
          ls -l android/app/src/main/jniLibs/arm64-v8a/
      - name: Compilar o APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: rubiana-medidor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
